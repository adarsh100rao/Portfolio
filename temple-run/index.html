<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Runner 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div id="score-board">Score: <span id="score">0</span> | Coins: <span id="coins">0</span></div>
        
        <div id="start-screen">
            <h1>Temple Runner 3D</h1>
            <p>Use <strong>LEFT/RIGHT arrows</strong> to switch lanes</p>
            <p>Use <strong>UP arrow</strong> to Jump over low obstacles</p>
            <p>Use <strong>DOWN arrow</strong> to Slide under high obstacles</p>
            <button id="start-btn">TAP TO PLAY</button>
        </div>
        
        <div id="game-over-screen" style="display: none;">
            <h2>Game Over</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
